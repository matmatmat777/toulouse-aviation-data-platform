name: Toulouse Aviation CI

on:
  push:
  pull_request:

jobs:
  tests-pyspark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark

      - name: Run PySpark tests
        run: python -m pytest -v spark/tests/

  terraform-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Initialize Terraform
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Validate Terraform
        run: terraform validate
        working-directory: terraform/environments/dev

  docker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  gcp-auth-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/408818015704/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-cicd@toulouse-aviation-data.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify GCP identity
        run: gcloud auth list

  deploy-demo:
    runs-on: ubuntu-latest
    needs:
      - tests-pyspark
      - terraform-check
      - docker-check
      - gcp-auth-check

    steps:
      - name: Simulate deployment
        run: echo "All quality gates passed - deployment authorized"